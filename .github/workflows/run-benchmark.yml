name: Run benchmark

# Step 2 of 2. Rebuilds the corpus (same seed, same size as in data/corpus_params.json), runs the full
# model comparison on the GitHub-hosted CPU runner, commits results/ and refreshes the README results
# blocks. Public repositories get a free 4-vCPU / 16 GB runner; a job may run for at most 6 hours.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated model keys (e5-small e5-base minilm-l12 bge-m3 e5-large labse)"
        default: "e5-small e5-base minilm-l12 bge-m3"
      ablation_model:
        description: "Model that gets the per-step normalization ablation"
        default: "e5-small"

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODELS: ${{ inputs.models }}
      ABLATION_MODEL: ${{ inputs.ablation_model }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Check that the reviewed question set exists
        run: |
          test -s data/queries.jsonl || { echo "::error::data/queries.jsonl is missing. Run the 'Build evaluation set' workflow first."; exit 1; }
          test -s data/corpus_params.json || { echo "::error::data/corpus_params.json is missing."; exit 1; }
          echo "questions: $(wc -l < data/queries.jsonl)"

      - name: Free disk space (model downloads are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml]"

      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: artifacts/emb_cache
          key: emb-${{ github.run_id }}
          restore-keys: emb-

      - name: Sample the corpus
        run: |
          N_DOCS=$(python -c "import json; print(json.load(open('data/corpus_params.json'))['n_docs'])")
          python -m pss.prepare_data --n-docs "$N_DOCS"

      - name: Run benchmark
        run: |
          echo "runner CPU: $(nproc) cores" 
          python -m pss.run_eval --models $MODELS --ablation-model "$ABLATION_MODEL" --device cpu

      - name: Show results in the run summary
        run: cat results/results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md README.fa.md
          git commit -m "Update benchmark results" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
